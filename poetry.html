<script type="application/json" id="stanza-data">["Ταξίδι πέρα από τη σιωπή", "Ένα άστρο έσβησε\nπάνω από τη θάλασσα,\nκι εγώ έμεινα στην ακτή\nνα ακούω τη Γη να αναπνέει.", "Στο χώμα υπήρχε ακόμη\nη μυρωδιά του πεύκου,\nη αλμύρα στα χείλη,\nένα παλιό τραγούδι από κάποιο παράθυρο.\nΚαι όμως, στον ουρανό\nάνοιγε μια πόρτα.", "Πέρασα.", "Εκεί όπου η νύχτα\nδεν ήταν μαύρη\nαλλά γεμάτη άγνωστα χρώματα,\nσυνάντησα πολιτισμούς\nπου είχαν χτίσει πόλεις\nγύρω από νεκρούς ήλιους.", "Οι κάτοικοί τους\nδεν μιλούσαν με λέξεις.\nΆγγιζαν το φως\nκαι το φως θυμόταν.", "Μου έδειξαν έναν πλανήτη\nμε δάση από γυαλί,\nποτάμια που κυλούσαν προς τον ουρανό\nκαι βουνά όπου η βροχή\nέπεφτε σαν αστέρια.", "Κι εγώ τους μίλησα\nγια τη Γη.", "Για τις ελιές\nπου επιμένουν στις πέτρες.\nΓια τα σπίτια στα νησιά\nπου ασπρίζουν κάτω από τον ήλιο.\nΓια το ψωμί πάνω στο τραπέζι,\nγια τα χέρια ενός ανθρώπου\nπου αγαπά έναν άλλον άνθρωπο\nχωρίς να ξέρει γιατί.", "Με κοίταξαν σιωπηλοί.", "Ύστερα μου έδειξαν\nτο πιο σκοτεινό μέρος του κόσμου τους.", "Εκεί υπήρχε ένας ωκεανός\nχωρίς νερό,\nγεμάτος χαμένες μνήμες\nπολιτισμών που είχαν ταξιδέψει\nπολύ μακριά\nκαι δεν γύρισαν ποτέ.", "Πάνω από αυτόν\nέκαιγε ένα μικρό φως.", "«Τι είναι;» ρώτησα.", "Και για πρώτη φορά\nάκουσα τη φωνή τους:", "«Η ελπίδα δεν χρειάζεται\nνα είναι μεγάλη.\nΧρειάζεται μόνο\nνα μην πεθάνει.»", "Τότε κατάλαβα\nπως ίσως όλα τα ταξίδια\nδεν οδηγούν σε άλλους κόσμους.", "Ίσως οδηγούν\nβαθύτερα μέσα μας.", "Κι όταν επέστρεψα στη Γη,\nτο πρωινό ήταν ίδιο.", "Η θάλασσα.\nΟι πέτρες.\nΤο πεύκο.\nΟ καφές στο τραπέζι.\nΈνα πουλί πάνω σε ένα καλώδιο.", "Μόνο που τώρα\nκάθε μικρό φως στο σκοτάδι\nμου έμοιαζε με μακρινό άστρο.", "Και κάθε άνθρωπος\nμε έναν ταξιδιώτη\nπου κάποτε, κάπου,\nθα σηκώσει το βλέμμα\nκαι θα ψιθυρίσει:", "«Υπάρχει κανείς εκεί έξω;»", "Και ίσως,\nσε έναν κόσμο\nπου δεν έχουμε ακόμη ανακαλύψει,\nκάποιος να κοιτάζει επίσης\nτον δικό του ουρανό\nκαι να περιμένει.", "Πέρα από τον τελευταίο πλανήτη\nτου χαρτογραφημένου ουρανού,\nτο σκάφος μου μπήκε στη σκιά\nενός ήλιου που δεν εξέπεμπε φως.", "Στο παράθυρο\nέμεινε για λίγο η Γη—\nμια μπλε ανάμνηση,\nένα σπίτι με αναμμένο φως,\nένα δέντρο που κουνιόταν στον άνεμο,\nένα ποτήρι νερό πάνω σε ένα τραπέζι.", "Ύστερα χάθηκε.", "Κάτω μου εμφανίστηκε ένας κόσμος\nχωρίς νύχτα και χωρίς ημέρα.\nΜόνο μια ατελείωτη αυγή\nπάνω από μαύρες πεδιάδες.", "Και μέσα στις πεδιάδες\nστεκόταν μια πόλη.", "Δεν είχε δρόμους.\nΔεν είχε πόρτες.\nΔεν είχε παράθυρα.", "Μόνο πύργους,\nτόσο ψηλούς\nπου έμοιαζαν να τρυπούν\nτο ίδιο το κενό.", "Προσγειώθηκα.", "Η σιωπή εκεί\nδεν ήταν απουσία ήχου.", "Ήταν παρουσία.", "Κάτι με παρακολουθούσε\nαπό κάτω.", "Βρήκα σημάδια πάνω στο έδαφος,\nκύκλους μέσα σε κύκλους,\nσαν κάποιος να είχε γράψει\nμια γλώσσα για πράγματα\nπου δεν έπρεπε να κατανοήσουμε.", "Και τότε εμφανίστηκαν.", "Όχι σώματα.\nΌχι πρόσωπα.", "Σκιές μέσα σε ανθρώπινο σχήμα,\nφτιαγμένες από σκοτάδι\nκαι λεπτές γραμμές γαλάζιου φωτός.", "Μου έδειξαν εικόνες.", "Αστέρια που γεννήθηκαν.\nΑστέρια που πέθαναν.\nΠλανήτες που κάποτε είχαν θάλασσες.\nΠολιτισμούς που έφτασαν στα άκρα\nτης γνώσης τους\nκαι ύστερα σώπασαν.", "Στην τελευταία εικόνα\nείδα τη Γη.", "Όχι όπως είναι τώρα.", "Είδα τις πόλεις της άδειες,\nτους ωκεανούς ακίνητους,\nτα βουνά σκεπασμένα με πάγο.", "Γύρισα προς εκείνους.", "«Πότε;»", "Δεν απάντησαν.", "Μου έδειξαν μόνο\nένα μικρό παιδί\nνα κοιμάται σε ένα δωμάτιο.", "Έξω έβρεχε.", "Στο περβάζι\nυπήρχε ένα φυτό.", "Το παιδί χαμογελούσε στον ύπνο του.", "Και τότε κατάλαβα.", "Δεν μου έδειχναν το μέλλον.", "Μου έδειχναν\nγιατί έπρεπε να επιστρέψω.", "Το σκάφος απογειώθηκε\nμέσα από την αιώνια σκιά.", "Πίσω μου η πόλη\nέσβησε έναν έναν τους πύργους της.", "Μπροστά μου\nη Γη μεγάλωνε.", "Κι εκεί,\nανάμεσα στο σκοτάδι του διαστήματος\nκαι στο πρώτο φως της αυγής,\nορκίστηκα πως όσο υπάρχει\nέστω ένα παράθυρο αναμμένο τη νύχτα,", "το σύμπαν\nδεν έχει ακόμη τελειώσει.", "Το σήμα ήρθε\nαπό έναν νεκρό γαλαξία.", "Δεν ήταν μήνυμα.", "Ήταν ψίθυρος.", "Κάθε νύχτα\nο σα\nένα μικρό φως αναμμένο.", "Προσγειώθηκα\nεκεί όπου τελειώνουν οι χάρτες\nκαι αρχίζει η σιωπή.", "Ο πλανήτης ήταν γκρίζος,\nμα κάτω από την πέτρα\nέτρεχε ένα αχνό, χρυσό φως.", "Δεν υπήρχαν δέντρα.\nΔεν υπήρχαν θάλασσες.\nΜόνο άνεμος\nπου κουβαλούσε φωνές.", "Στην πρώτη κοιλάδα\nβρήκα ένα σπίτι.", "Μικρό.", "Παράξενα οικείο.", "Είχε μια πόρτα,\nένα τραπέζι,\nμια καρέκλα\nκαι πάνω στο περβάζι\nένα ξερό λουλούδι.", "Σαν κάποιος\nνα είχε φύγει χθες.", "Μπήκα.", "Στους τοίχους\nυπήρχαν εικόνες\nαπό έναν πολιτισμό\nπου δεν γνώριζα.", "Παιδιά κάτω από έναν κόκκινο ήλιο.\nΠλοία ανάμεσα στα άστρα.\nΓυναίκες με ασημένια μάτια.\nΆνθρωποι που άγγιζαν\nτο φως πριν κοιμηθούν.", "Στο τελευταίο δωμάτιο\nυπήρχε μόνο ένας καθρέφτης.", "Κοίταξα μέσα.", "Δεν είδα εμένα.", "Είδα τη Γη.", "Τη βροχή πάνω στα πεζοδρόμια.\nΤον καπνό από ένα ζεστό σπίτι.\nΈνα δέντρο να ανθίζει.\nΈναν ηλικιωμένο άνθρωπο\nνα κοιτάζει τη θάλασσα.", "Και τότε κατάλαβα.", "Ο πλανήτης δεν θυμόταν\nτους νεκρούς του.", "Θυμόταν\nόσα αγάπησαν.", "Γι’ αυτό δεν είχε ξεχάσει.", "Γι’ αυτό κρατούσε ακόμη\nένα λουλούδι στο περβάζι.", "Βγήκα έξω.", "Ο ουρανός σκοτείνιαζε.", "Μα κάπου στην άκρη του ορίζοντα\nγεννιόταν ένα μικρό φως.", "Και σκέφτηκα:", "Ίσως η μνήμη\nνα είναι ο πιο παράξενος τρόπος\nμε τον οποίο ένα σύμπαν\nαρνείται να πεθάνει.", "Η πόλη αιωρούνταν\nπάνω από έναν ωκεανό χωρίς νερό.", "Χιλιάδες γέφυρες\nένωναν τους πύργους της,\nκαι ανάμεσα στους πύργους\nπετούσαν σιωπηλά πλάσματα\nμε διάφανα φτερά.", "Κανείς δεν μιλούσε.", "Κανείς δεν με περίμενε.", "Κι όμως,\nόταν πάτησα στην κεντρική πλατεία,\nόλα τα φώτα άναψαν.", "Ένα προς ένα.", "Σαν να ξυπνούσε\nκάτι αρχαίο.", "Στο κέντρο της πόλης\nυπήρχε ένας μαύρος ήλιος.", "Δεν έδινε φως.", "Απορροφούσε το φως.", "Και γύρω του\nστέκονταν χιλιάδες εξωγήινοι,\nακίνητοι σαν αγάλματα.", "Ένας από αυτούς\nπλησίασε.", "Το πρόσωπό του\nδεν είχε μάτια.", "Μόνο ένα μικρό αστέρι\nεκεί όπου θα έπρεπε να βρίσκεται\nη καρδιά.", "Μου έδειξε τον ουρανό.", "Εκατομμύρια άστρα\nέσβηναν αργά.", "«Γιατί;» ρώτησα.", "Μου απάντησε:", "«Δεν πεθαίνουν.»", "«Τότε τι συμβαίνει;»", "«Ξεχνούν.»", "Κοίταξα τον μαύρο ήλιο.", "Μέσα του\nείδα κόσμους να χάνονται\nχωρίς έκρηξη,\nχωρίς κραυγή,\nχωρίς τελευταίο αντίο.", "Μόνο σιωπή.", "Τότε σκέφτηκα τη Γη.", "Το μικρό μου σπίτι.\nΤη μυρωδιά της βρεγμένης γης.\nΤα φώτα μιας πόλης μετά τη βροχή.\nΈνα τραγούδι που είχα ξεχάσει\nπως θυμάμαι.", "Και κατάλαβα\nπως ίσως η μεγαλύτερη μορφή θανάτου\nδεν είναι να πάψεις να υπάρχει.", "Είναι να υπάρχεις\nκαι κανείς να μη θυμάται\nπως κάποτε υπήρξες.", "Έφυγα πριν ξημερώσει.", "Πίσω μου\nη εξωγήινη πόλη\nέσβησε τα φώτα της.", "Μπροστά μου\nο μαύρος ουρανός\nάνοιξε σαν πληγή.", "Και μέσα του\nένα μόνο άστρο\nαρνήθηκε να σβήσει.", "Λένε πως κάποτε\nοι άνθρωποι θα φύγουν από τη Γη.", "Θα αφήσουν πίσω τους\nτις πόλεις,\nτα δάση,\nτις θάλασσες\nκαι τα μικρά σπίτια\nόπου κάποτε ονειρεύονταν.", "Θα χτίσουν πολιτείες\nανάμεσα στους πλανήτες.", "Θα ταξιδεύουν\nμέσα από σκουληκότρυπες\nκαι νεκρά άστρα.", "Θα μιλούν με πολιτισμούς\nπου γεννήθηκαν\nπριν ακόμη υπάρξει η Γη.", "Και ίσως κάποτε\nσυναντήσουν ένα πλάσμα\nπου θα τους ρωτήσει:", "«Από πού ήρθατε;»", "Και κάποιος\nθα κοιτάξει πίσω.", "Θα δει έναν μικρό γαλάζιο πλανήτη\nχαμένο μέσα στο σκοτάδι.", "Θα θυμηθεί\nτις καλοκαιρινές νύχτες.", "Τη θάλασσα.", "Το άρωμα του πεύκου.", "Το ψωμί στο τραπέζι.", "Ένα χέρι που κρατούσε\nένα άλλο χέρι\nσε έναν δρόμο γεμάτο βροχή.", "Και θα πει:", "«Από εκεί.»", "Ο εξωγήινος\nθα κοιτάξει τη Γη.", "«Είναι ακόμη εκεί;»", "Κανείς δεν θα απαντήσει.", "Γιατί ίσως τότε\nη Γη να είναι μόνο μια ανάμνηση.", "Ένα αρχαίο όνομα\nσε κάποιο διαστημικό αρχείο.", "Μια μικρή μπλε κουκκίδα\nσε μια ξεχασμένη οθόνη.", "Κι όμως—", "κάπου μέσα στο σκοτάδι\nένα παιδί θα κοιτάζει τα άστρα\nαπό έναν κόσμο που δεν γνωρίζουμε ακόμη.", "Και θα ονειρεύεται\nπως κάποτε\nθα ταξιδέψει κι εκείνο.", "Δεν θα ξέρει\nότι κάποιοι πριν από αυτό\nέκαναν το ίδιο όνειρο.", "Δεν θα ξέρει\nότι οι παλιοί ταξιδιώτες\nκουβαλούσαν μέσα τους\nολόκληρη τη Γη.", "Θα ξέρει μόνο\nπως υπάρχει ένα φως\nπολύ μακριά.", "Και θα ξεκινήσει.", "Γιατί ίσως αυτό είναι\nτο πιο ανθρώπινο πράγμα\nστο σύμπαν:", "να γνωρίζεις\nπως όλα τελειώνουν\nκαι παρ’ όλα αυτά\nνα συνεχίζεις να ταξιδεύεις\nπρος το φως."]</script>
<style>
:root {
  --bg: #07080a;
  --bg2: #101114;
  --border: #2a2a2a;
  --ink: #f0ede8;
  --inkdim: #b0a898;
  --inkfaint: #5a5a5a;
  --card-bg: #15161a;
  --accent: #8fb8ff;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image: radial-gradient(ellipse at 50% -10%, rgba(143,184,255,0.08) 0%, transparent 60%);
}

/* ---- Cover ---- */
#cover {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  overflow: hidden;
}
#cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.55;
  filter: saturate(1.1) contrast(1.05);
}
#cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(7,8,10,0.35) 0%, rgba(7,8,10,0.85) 75%, rgba(7,8,10,1) 100%);
}
.cover-inner { position: relative; z-index: 1; max-width: 720px; }
.cover-inner h1 {
  font-family: 'Cinzel', serif;
  font-weight: 500;
  letter-spacing: 0.16em;
  font-size: clamp(1.4rem, 5vw, 2.6rem);
  line-height: 1.4;
  text-shadow: 0 2px 18px rgba(0,0,0,0.8);
}
.cover-inner p.caption {
  margin-top: 18px;
  font-style: italic;
  color: var(--inkdim);
  font-size: clamp(0.85rem, 2vw, 1.05rem);
  letter-spacing: 0.03em;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.cover-inner .credit {
  margin-top: 8px;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--inkfaint);
}
#start-btn {
  margin-top: 34px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--inkdim);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 0.22em;
  padding: 12px 34px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: blur(2px);
}
#start-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--ink); }

/* ---- Slideshow ---- */
#stage {
  display: none;
  flex: 1;
  flex-direction: column;
  min-height: 100vh;
}
#stage.active { display: flex; }
#cover.hidden { display: none; }

.topbar {
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 18px 16px 0;
}
.mode-tab {
  background: transparent;
  border: 1px solid var(--border);
  border-bottom: none;
  color: var(--inkfaint);
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  padding: 9px 22px;
  cursor: pointer;
  transition: all 0.2s;
}
.mode-tab:hover { color: var(--ink); border-color: var(--inkdim); }
.mode-tab.active { color: var(--ink); border-color: var(--inkdim); background: var(--bg2); }

.slide-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}
.slide-card {
  max-width: 720px;
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 32px;
  min-height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.greek-text {
  font-size: clamp(1.1rem, 2.6vw, 1.6rem);
  line-height: 1.9;
  text-align: center;
  white-space: pre-wrap;
  letter-spacing: 0.02em;
  font-weight: 400;
}
.cipher-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  row-gap: 10px;
}
.gc {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.gc img { width: 40px; height: 40px; border-radius: 3px; display: block; }
.gc .punct {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif; font-size: 20px; color: var(--inkdim);
}
.sp { width: 18px; height: 40px; }
.nl { flex-basis: 100%; height: 4px; }

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}
.nav-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--inkdim);
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  padding: 9px 20px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--inkdim); color: var(--ink); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
#counter {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--inkfaint);
  min-width: 90px;
  text-align: center;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #07080a; --bg2: #101114; --card-bg: #15161a; --ink: #f0ede8;
  }
}
</style>
</head>

  <div class="cover-inner">
    <h1>Ταξίδι πέρα από τη σιωπή</h1>
    <p class="caption">Ένα ταξιδιωτικό ποίημα, γραμμένο σε δύο γλώσσες:<br>ελληνικά &nbsp;&amp;&nbsp; το κρυπτογραφημένο αλφάβητο.</p>
    <p class="credit">Φωτογραφία: NASA — «mother-of-pearl» νέφη διοξειδίου του άνθρακα στον Άρη</p>
    <button id="start-btn" onclick="startShow()">ΕΙΣΟΔΟΣ</button>
  </div>
</div>

<div id="stage">
  <div class="topbar">
    <button class="mode-tab active" id="tab-greek" onclick="setMode('greek')">ΕΛΛΗΝΙΚΑ</button>
    <button class="mode-tab" id="tab-cipher" onclick="setMode('cipher')">ΚΡΥΠΤΟΓΡΑΦΗΜΕΝΑ</button>
  </div>
  <div class="slide-wrap">
    <div class="slide-card" id="slide-card"></div>
  </div>
  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="stopAutoplay(); prevSlide()">‹ ΠΡΟΗΓ.</button>
    <button class="nav-btn" id="play-btn" onclick="toggleAutoplay()">▶ ΑΥΤΟΜΑΤΗ</button>
    <div id="counter">1 / 1</div>
    <button class="nav-btn" id="next-btn" onclick="stopAutoplay(); nextSlide()">ΕΠΟΜ. ›</button>
  </div>
</div>

<script>
var G = JSON.parse(document.getElementById('glyph-data').textContent);
var STANZAS = JSON.parse(document.getElementById('stanza-data').textContent);

var mode = 'greek'; // or 'cipher'
var idx = 0;

function startShow() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('stage').classList.add('active');
  render();
}

function setMode(m) {
  mode = m;
  document.getElementById('tab-greek').classList.toggle('active', m === 'greek');
  document.getElementById('tab-cipher').classList.toggle('active', m === 'cipher');
  render();
}

function stripAccents(ch) {
  // Decompose (e.g. ά -> α + combining accent), drop combining marks
  var d = ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // Final sigma -> regular sigma, since the cipher alphabet only has one sigma glyph
  if (d === 'ς' || d === 'Σ' && ch === 'ς') d = 'σ';
  if (ch === 'ς') d = 'σ';
  return d;
}

function renderCipher(text) {
  var frag = document.createDocumentFragment();
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === '\n') {
      var nl = document.createElement('div');
      nl.className = 'nl';
      frag.appendChild(nl);
      continue;
    }
    var cell = document.createElement('div');
    cell.className = 'gc';
    if (ch === ' ') {
      var sp = document.createElement('div');
      sp.className = 'sp';
      cell.appendChild(sp);
    } else {
      var lower = stripAccents(ch).toLowerCase();
      if (G[lower]) {
        var img = document.createElement('img');
        img.src = G[lower];
        img.alt = ch;
        cell.appendChild(img);
      } else {
        var u = document.createElement('div');
        u.className = 'punct';
        u.textContent = ch;
        cell.appendChild(u);
      }
    }
    frag.appendChild(cell);
  }
  return frag;
}

function render() {
  var card = document.getElementById('slide-card');
  card.innerHTML = '';
  var text = STANZAS[idx];
  if (mode === 'greek') {
    var p = document.createElement('div');
    p.className = 'greek-text';
    p.textContent = text;
    card.appendChild(p);
  } else {
    var grid = document.createElement('div');
    grid.className = 'cipher-grid';
    grid.appendChild(renderCipher(text));
    card.appendChild(grid);
  }
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + STANZAS.length;
  document.getElementById('prev-btn').disabled = (idx === 0);
  document.getElementById('next-btn').disabled = (idx === STANZAS.length - 1);
}

function prevSlide() { if (idx > 0) { idx--; render(); } }
function nextSlide() {
  if (idx < STANZAS.length - 1) { idx++; render(); }
  else if (autoTimer) { idx = 0; render(); } // loop when auto-playing
}

var autoTimer = null;
var AUTOPLAY_MS = 4500;

function toggleAutoplay() {
  if (autoTimer) {
    stopAutoplay();
  } else {
    startAutoplay();
  }
}

function startAutoplay() {
  if (autoTimer) return;
  autoTimer = setInterval(nextSlide, AUTOPLAY_MS);
  document.getElementById('play-btn').textContent = '⏸ ΠΑΥΣΗ';
}

function stopAutoplay() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('play-btn').textContent = '▶ ΑΥΤΟΜΑΤΗ';
}

document.addEventListener('keydown', function(e) {
  if (!document.getElementById('stage').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') { stopAutoplay(); prevSlide(); }
  else if (e.key === 'ArrowRight') { stopAutoplay(); nextSlide(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAutoplay(); }
});
</script>
